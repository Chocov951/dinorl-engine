[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dinorl-engine"
version = "0.1.0"
description = "Moteur déterministe du jeu DinoRL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask>=3.1,<4",
    "gymnasium>=1.0,<2",
    "jsonschema>=4.23,<5",
    "numpy>=2.0,<3",
    "safetensors>=0.5,<1",
    "sb3-contrib>=2.5,<3",
    "stable-baselines3>=2.5,<3",
    "torch>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.130,<7",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["dinorl_engine"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
